---
- name: Install java and net-tools
  hosts: webserver
  tasks:
    - name: Update apt repo and cache
      apt:
        update_cache: yes
        force_apt_get: yes
        cache_valid_time: 3600
    - name: Install Java 11
      apt:
        name: openjdk-11-jdk-headless
    - name: Install net-tools
      apt:
        name: net-tools

- name: Download and unpack Nexus installer
  hosts: webserver
  tasks:
    - name: Check if Nexus folder was found
      stat: 
        path: /opt/nexus
      register: nexus_folder 
    - name: Download Nexus
      get_url:
        url: https://download.sonatype.com/nexus/3/latest-linux-x86_64.tar.gz
        dest: /opt/
      register: Download_result
    - name: Untar Nexus installer
      unarchive:
        src: "{{Download_result.dest}}"
        dest: /opt/
        remote_src: yes
      when: not nexus_folder.stat.exists
    - name: Find Nexus folder
      find:
        paths: /opt/
        patterns: "nexus-*"
        file_type: directory
      register: find_result
    - name: Rename Nexus folder
      shell: mv {{find_result.files[0].path}} /opt/nexus
      when: not nexus_folder.stat.exists

- name: Create nexus user to own nexus folder
  hosts: webserver
  tasks:
    - name: Ensure nexus group exists
      group:
        name: nexus
        state: present
    - name: Create nexus user
      user:
        name: nexus
        group: nexus
    - name: Make nexus user the owner of nexus folder
      file:
        path: /opt/nexus
        owner: nexus
        group: nexus
        state: directory
        recurse: yes
    - name: Make nexus user the owner of sonatype-work folder
      file:
        path: /opt/sonatype-work
        owner: nexus
        group: nexus
        state: directory
        recurse: yes
- name: Configure nexus to run as nexus user
  hosts: webserver
  become: true
  become_user: nexus
  tasks:
    - name: Set run_as_user in nexus.rc
      blockinfile:
        path: /opt/nexus/bin/nexus.rc
        block: |
          run_as_user=nexus
        create: yes
    - name: Start nexus
      command: /opt/nexus/bin/nexus start
- name: Verify nexus is running
  hosts: webserver
  tasks:
    - name: Wait one minute
      pause:
        minutes: 1
    - name: Check if nexus is running
      shell: netstat -plnt 
      register: nexus_status
    - debug: msg="{{nexus_status.stdout}}"
    - name: Check if nexus is running
      shell: ps aux | grep nexus
      register: nexus_status_ps
    - debug: msg="{{nexus_status_ps.stdout}}"
